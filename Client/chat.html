<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZayneChat | Dashboard</title>

    <link rel="stylesheet" href="dashboard.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="/socket.io/socket.io.js"></script>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="top">
            <h2>💬 ZayneChat</h2>
        </div>

        <div class="profile">
            <img src="images/avatars/avatar1.jpg" id="userAvatar" alt="Your avatar">
            <h3 id="username">Loading...</h3>
        </div>

        <div class="search">
            <i class="fa fa-search"></i>
            <input type="text" placeholder="Search contacts...">
        </div>

        <div class="contacts">
            <ul id="onlineUsers" class="online-users"></ul>
        </div>

    </aside>

    <main class="chat">

        <div class="chat-header">
            <div class="user-info">
                <img src="images/avatars/avatar1.jpg" id="activeChatAvatar" alt="Active chat user">
                <div>
                    <h3 id="currentChat">General Chat</h3>
                    <small id="chatStatus">Online</small>
                </div>
            </div>

            <div class="actions">
                <i class="fa fa-phone"></i>
                <i class="fa fa-video"></i>
                <i class="fa fa-ellipsis-vertical"></i>
            </div>
        </div>

        <div class="messages" id="messages"></div>

        <div id="typingIndicator" class="typing"></div>

        <form id="messageForm" class="chat-input">
            <i class="fa-solid fa-face-smile" id="emojiBtn" aria-label="Emoji picker"></i>
            <i class="fa-solid fa-paperclip"></i>

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                autocomplete="off"
                required>

            <button id="sendBtn" type="submit">
                <i class="fa-solid fa-paper-plane"></i>
            </button>

            <div id="emojiPicker" class="emoji-picker">
                😀 😃 😄 😁 😆 😂 🤣 😊 😍 😎 😢 😡 😴 ❤️ 💙 💚 💛 🧡 💜
                👍 👎 👏 🙌 🎉 🎂 🔥 ⭐ 🚀
            </div>
        </form>

    </main>

</div>

<script src="chat.js"></script>

</body>
</html>
